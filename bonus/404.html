<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman tidak ditemukan</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #161310; color: #f4d172; text-align: center; padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { border: 1px solid rgba(244,209,114,.25); border-radius: 18px; padding: 2.5rem 2rem; max-width: 520px; }
    h1 { margin: 0 0 .25rem; font-size: 3rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; font-weight: 600; }
    p { margin: .3rem 0; color: #cbb98a; line-height: 1.5; }
    a { display: inline-block; margin-top: 1.25rem; color: #161310; background: #f4d172;
        text-decoration: none; font-weight: 700; padding: .7rem 1.4rem; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Halaman tidak ditemukan</h2>
    <p>Maaf, halaman yang Anda cari tidak tersedia atau sudah dipindahkan.</p>
    <a href="/pwa/">Kembali ke beranda</a>
  </div>
</body>
</html>
