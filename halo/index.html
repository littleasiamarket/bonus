<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #161310;
      color: #f4d172;
      text-align: center;
      padding: 2rem;
    }
    .card {
      border: 1px solid rgba(244, 209, 114, .25);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      max-width: 520px;
    }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    p { margin: .3rem 0; color: #cbb98a; line-height: 1.5; }
    code { color: #f4d172; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Halo 👋</h1>
    <p>Ini folder <code>halo</code>, disajikan oleh Worker <strong>halo</strong>.</p>
    <p>Ganti isi <code>halo/</code> dengan konten Anda.</p>
  </div>
</body>
</html>
