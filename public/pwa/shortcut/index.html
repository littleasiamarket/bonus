<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Shortcut</title>
<meta name="theme-color" content="#FF0000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YouTube">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .logo {
    width: 88px; height: 88px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #aaa;
    margin: 0 0 28px;
  }
  .spinner {
    width: 32px; height: 32px;
    margin: 0 auto 20px;
    border: 3px solid #333;
    border-top-color: #FF0000;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: #FF0000;
    color: #fff;
    margin-bottom: 12px;
  }
  .btn-secondary {
    background: transparent;
    color: #aaa;
    border: 1px solid #444;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icons/icon.svg" alt="YouTube shortcut icon">
    <h1>YouTube Shortcut</h1>
    <p class="subtitle">One tap to open YouTube</p>

    <!-- shown only while waiting to see if beforeinstallprompt will fire -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p class="subtitle">Preparing install&hellip;</p>
    </div>

    <!-- shown once we know whether install is available; page waits here for a tap -->
    <div id="install-state" class="hidden">
      <button class="btn btn-primary hidden" id="install-btn">Install App</button>
      <br>
      <button class="btn btn-secondary" id="continue-btn">Continue in browser</button>
    </div>
  </div>

<script>
  var TARGET_URL = "https://www.youtube.com/";
  var PROMPT_WAIT_MS = 2000; // how long to wait for beforeinstallprompt before giving up on it

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  function goToTarget() {
    window.location.replace(TARGET_URL);
  }

  var isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    // This IS the installed shortcut being launched: go straight to the target.
    goToTarget();
  } else {
    // Otherwise this is the install page: stay put, do nothing until the user taps a button.
    var loadingState = document.getElementById("loading-state");
    var installState = document.getElementById("install-state");
    var installBtn = document.getElementById("install-btn");
    var continueBtn = document.getElementById("continue-btn");
    var deferredPrompt = null;
    var revealed = false;

    function reveal() {
      if (revealed) return;
      revealed = true;
      loadingState.classList.add("hidden");
      installState.classList.remove("hidden");
      if (deferredPrompt) installBtn.classList.remove("hidden");
    }

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault(); // stop the browser's own mini-infobar; we show our own button instead
      deferredPrompt = event;
      reveal();
    });

    // If beforeinstallprompt never fires (iOS Safari, desktop, already installed
    // some other way), stop waiting and just offer the manual continue option.
    // This only reveals the buttons -- it never navigates by itself.
    setTimeout(reveal, PROMPT_WAIT_MS);

    installBtn.addEventListener("click", function () {
      if (!deferredPrompt) return;
      installBtn.disabled = true;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        goToTarget();
      });
    });

    continueBtn.addEventListener("click", goToTarget);
  }
</script>
</body>
</html>
