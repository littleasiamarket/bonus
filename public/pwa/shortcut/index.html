<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Shortcut</title>
<meta name="theme-color" content="#FF0000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YouTube">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; }
  .spinner {
    width: 40px; height: 40px;
    margin: 0 auto 16px;
    border: 4px solid #333;
    border-top-color: #FF0000;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #FF0000; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Opening YouTube&hellip;</p>
    <p><a href="https://www.youtube.com/" id="fallback-link">Tap here if not redirected</a></p>
  </div>

<script>
  var TARGET_URL = "https://www.youtube.com/";

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  document.getElementById("fallback-link").href = TARGET_URL;
  window.location.replace(TARGET_URL);
</script>
</body>
</html>
